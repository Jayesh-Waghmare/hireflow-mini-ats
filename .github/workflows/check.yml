name: Application checks
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm run install:ci
      - run: node --experimental-strip-types --test tests/model.test.ts
      - run: npx tsc --noEmit
      - run: npm run build
